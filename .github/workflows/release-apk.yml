name: Build release APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/release-*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install the requested Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Build unsigned release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          gradle --no-daemon --console=plain :app:assembleRelease -PunsignedRelease=true --stacktrace 2>&1 | tee release-output/build.log
      - name: Verify and collect release APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          unzip -t "$apk" > release-output/zip-verification.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > release-output/apk-info.txt
          if grep -q 'application-debuggable' release-output/apk-info.txt; then
            echo 'Release APK is unexpectedly debuggable' >&2
            exit 1
          fi
          cp "$apk" release-output/Turkiye-Yuzyili-1.0-release-unsigned.apk
          cp app/build/outputs/apk/release/output-metadata.json release-output/
          cd release-output
          sha256sum Turkiye-Yuzyili-1.0-release-unsigned.apk > SHA256SUMS
          printf 'Variant: release\nSigning: unsigned (no release key supplied)\nCommit: %s\n' "$GITHUB_SHA" > BUILD-INFO.txt
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Turkiye-Yuzyili-release-unsigned
          path: |
            release-output/*.apk
            release-output/SHA256SUMS
            release-output/BUILD-INFO.txt
            release-output/apk-info.txt
            release-output/output-metadata.json
            release-output/zip-verification.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android signing tool for local release signing
        uses: actions/upload-artifact@v4
        with:
          name: android-release-signing-tool
          path: ${{ env.ANDROID_HOME }}/build-tools/36.0.0/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: release-output/build.log
          if-no-files-found: warn
          retention-days: 30
